  <!-- Root -->
  <rect x="500" y="60" width="200" height="50" class="node root" />
  <text x="600" y="85" class="label">自行開發技能</text>

  <!-- Level 1 parents -->
  <rect x="160" y="180" width="200" height="50" class="node parent" />
